<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500" role="img" aria-labelledby="title desc"><title id="title">One continuous thread</title><desc id="desc">Equal community tiles share a single flowing connection, without a central leader.</desc><defs><linearGradient id="bg"><stop stop-color="#f4f0e9"/><stop offset=".5" stop-color="#f8d4e5"/><stop offset="1" stop-color="#f4f0e9"/></linearGradient><linearGradient id="pearl" x2=".85" y2="1"><stop stop-color="#fffaf8"/><stop offset=".52" stop-color="#f8d4e5"/><stop offset="1" stop-color="#d892b6"/></linearGradient><linearGradient id="rose" x2=".8" y2="1"><stop stop-color="#fff3f8"/><stop offset=".42" stop-color="#f2a8cd"/><stop offset="1" stop-color="#b96991"/></linearGradient><linearGradient id="ink" x2="1" y2="1"><stop stop-color="#51404c"/><stop offset="1" stop-color="#191719"/></linearGradient><linearGradient id="wire" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1500" y2="0"><stop stop-color="#ca91af" stop-opacity=".15"/><stop offset=".3" stop-color="#b96991"/><stop offset=".7" stop-color="#b96991"/><stop offset="1" stop-color="#ca91af" stop-opacity=".15"/></linearGradient><radialGradient id="aura"><stop stop-color="#fffaf8" stop-opacity=".85"/><stop offset=".6" stop-color="#f2a8cd" stop-opacity=".28"/><stop offset="1" stop-color="#f2a8cd" stop-opacity="0"/></radialGradient><filter id="shadow" x="-50%" y="-50%" width="200%" height="220%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#915772" flood-opacity=".22"/></filter><filter id="glow" x="-50%" y="-100%" width="200%" height="300%"><feGaussianBlur stdDeviation="9"/></filter></defs><rect width="1500" height="500" fill="url(#bg)"/><ellipse cx="750" cy="250" rx="680" ry="390" fill="url(#aura)" opacity="0.65"/><path d="M-40 250C180 250 160 165 370 165S555 330 750 330S945 165 1130 165S1330 250 1540 250" fill="none" stroke="url(#wire)" stroke-width="3"/><g filter="url(#shadow)"><rect x="34" y="189" width="92" height